<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Projects Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f5f7fb;
        }

        .login-card{
            max-width:450px;
            margin:90px auto;
            border:none;
            border-radius:15px;
        }

        .card-body{
            padding:35px;
        }

        .logo{
            font-size:45px;
            text-align:center;
            margin-bottom:10px;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="card shadow login-card">

        <div class="card-body">

            <div class="logo">
                🔒
            </div>

            <h3 class="text-center mb-2">
                Internal Projects
            </h3>

            <p class="text-center text-muted mb-4">
                Enter the internal access code.
            </p>

            {% if error %}
            <div class="alert alert-danger">
                {{ error }}
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <input
                    type="password"
                    name="code"
                    class="form-control mb-3"
                    placeholder="Access Code"
                    required
                >

                <button class="btn btn-dark w-100 mb-3">
                    Open Internal Dashboard
                </button>
            </form>

            <a href="{% url 'project_report' %}" class="btn btn-outline-secondary w-100">
                ← Back to Home
            </a>

        </div>

    </div>

</div>

</body>
</html>
