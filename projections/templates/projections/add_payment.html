{% load humanize %}
<!DOCTYPE html>
<html>
<head>
    <title>Add Payment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">

    <h4>Add Payment</h4>
    <p class="text-muted">
        {{ project.title }} – {{ project.company }}
    </p>

    <div class="card p-3 mb-3">
        <strong>Project Value:</strong>
        ZMW {{ project.amount|floatformat:2|intcomma }}<br>

        <strong>Total Paid:</strong>
        ZMW {{ total_paid|floatformat:2|intcomma }}<br>

        <strong>Balance Due:</strong>
        ZMW {{ balance_due|floatformat:2|intcomma }}
    </div>

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Amount Paid</label>
            <input type="number"
                   step="0.01"
                   name="amount_paid"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Payment Date</label>
            <input type="date"
                   name="payment_date"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Reference</label>
            <input type="text"
                   name="reference"
                   class="form-control">
        </div>

        <button class="btn btn-success">
            Save Payment
        </button>

        <a href="{% url 'projections:payments_dashboard' %}"
           class="btn btn-secondary">
            Cancel
        </a>
    </form>

</div>

</body>
</html>
