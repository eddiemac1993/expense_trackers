{% load humanize %}
<!DOCTYPE html>
<html>
<head>
    <title>Edit Payment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">

    <h4>Edit Payment</h4>
    <p class="text-muted">
        {{ project.title }} – {{ project.customer }}
    </p>

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label>Amount Paid</label>
            <input type="number"
                   step="0.01"
                   name="amount_paid"
                   value="{{ payment.amount_paid }}"
                   class="form-control"
                   required>
            <small class="text-muted">
                Max allowed: ZMW {{ max_allowed|floatformat:2|intcomma }}
            </small>
        </div>

        <div class="mb-3">
            <label>Payment Date</label>
            <input type="date"
                   name="payment_date"
                   value="{{ payment.payment_date|date:'Y-m-d' }}"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label>Reference</label>
            <input type="text"
                   name="reference"
                   value="{{ payment.reference }}"
                   class="form-control">
        </div>

        <div class="mb-3">
            <label>Notes</label>
            <textarea name="notes"
                      class="form-control">{{ payment.notes }}</textarea>
        </div>

        <button class="btn btn-success">Update Payment</button>
        <a href="{% url 'projections:project_payments' project.id %}"
           class="btn btn-secondary">
            Cancel
        </a>
    </form>

</div>

</body>
</html>
