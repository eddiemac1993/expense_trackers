{% extends "base.html" %}

{% block content %}
<div class="container mt-5" style="max-width: 500px;">
    <div class="card shadow">
        <div class="card-body">
            <h3 class="mb-3">Internal Projects Access</h3>

            <form method="post">
                {% csrf_token %}

                <label class="form-label">Enter Access Code</label>
                <input type="password" name="code" class="form-control mb-3" required>

                <button class="btn btn-dark w-100">
                    Enter Internal Dashboard
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
